<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teta SQL EDSL Tutorial</title>
    <meta
      name="description"
      content="Learn SQL through a typed EDSL and inspect the SQL it generates."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <div>
          <h1>Teta Playground</h1>
          <p>TypeScript queries, rendered as executable SQL.</p>
        </div>
      </div>
      <div class="status-card" aria-live="polite">
        <span class="status-label">Query engine</span>
        <span id="duckdb-status" class="runner-status">Loading DuckDB...</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Tutorial lessons">
        <div class="sidebar-heading">
          <span>Lessons</span>
          <span id="lesson-progress" class="lesson-progress">0 complete</span>
          <button
            id="lesson-menu"
            class="lesson-menu"
            type="button"
            aria-expanded="false"
            aria-controls="nav-tools nav"
          >
            Browse
          </button>
        </div>
        <div id="nav-tools" class="nav-tools">
          <label class="search-label" for="nav-search">Find a lesson</label>
          <input
            id="nav-search"
            type="search"
            placeholder="Search lessons"
            autocomplete="off"
          />
        </div>
        <nav id="nav"></nav>
      </aside>

      <section class="content">
        <div id="content"></div>
      </section>
    </main>

    <script src="./app.js"></script>
    <script>
      window.MonacoEnvironment = {
        getWorkerUrl: function () {
          return "./monaco-worker.js";
        },
      };
    </script>
    <script src="./monaco/vs/loader.js"></script>
    <script>
      require.config({ paths: { vs: "./monaco/vs" } });
      require(["vs/editor/editor.main"], function () {
        if (window.App && window.monaco) {
          window.App.init(window.monaco);
        }
      });
    </script>
  </body>
</html>
